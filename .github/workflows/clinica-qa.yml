name: QA Clínica del PC

on:
  push:
    branches:
      - feat/custodia-retiro-terceros
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinica-pc
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clinica-pc/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar ESLint
        run: npm run lint
      - name: Pruebas automáticas de flujos
        run: npm run test:flujos
      - name: Compilar aplicación
        run: npm run build
